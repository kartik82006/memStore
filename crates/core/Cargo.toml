[package]
name = "memstor-core"
version.workspace = true
edition.workspace = true
description = "Records which files you work on and when, in a local SQLite database."

[dependencies]
anyhow.workspace = true
base64 = "0.22"
chrono.workspace = true
dirs.workspace = true
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
kamadak-exif = "0.6"
lnk = "0.6"
notify = "8"
pdf-extract = "0.12.1"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
lnk = { version = "0.6", features = ["binwrite", "unstable-save"] }

[target.'cfg(windows)'.dependencies]
mslnk = "0.1.8"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_Foundation"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
