[package]
name = "memstor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
lnk = "0.6"
notify = "8"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
lnk = { version = "0.6", features = ["binwrite", "unstable-save"] }
